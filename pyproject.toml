[project]
name = "xiaoverse-google-mcp"
version = "0.4.0"
description = "Local MCP server for personal Gmail, Google Calendar, and Google Drive access"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "requests>=2.31.0",
]

[project.scripts]
google-mcp = "google_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/google_mcp/instructions.md" = "google_mcp/instructions.md"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["google_mcp"]

[tool.ty.rules]
all = "error"
